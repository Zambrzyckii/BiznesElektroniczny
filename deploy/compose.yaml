services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?copy deploy/.env.example to deploy/.env}
      MARIADB_DATABASE: prestashop
      MARIADB_USER: prestashop
      MARIADB_PASSWORD: ${DB_PASSWD:?copy deploy/.env.example to deploy/.env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 3

  shop:
    image: prestashop/prestashop:8.2.8-8.1-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_SERVER: db
      DB_NAME: prestashop
      DB_USER: prestashop
      DB_PASSWD: ${DB_PASSWD:?copy deploy/.env.example to deploy/.env}
      PS_INSTALL_AUTO: 1
      PS_LANGUAGE: pl
      PS_COUNTRY: PL
      PS_DOMAIN: localhost
      PS_ENABLE_SSL: 1
      PS_FOLDER_ADMIN: ${PS_FOLDER_ADMIN:?copy deploy/.env.example to deploy/.env}
      ADMIN_MAIL: ${ADMIN_MAIL:?copy deploy/.env.example to deploy/.env}
      ADMIN_PASSWD: ${ADMIN_PASSWD:?copy deploy/.env.example to deploy/.env}
    volumes:
      - shop-data:/var/www/html
      - ./shop-https.conf:/etc/apache2/conf-enabled/shop-https.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "test ! -d /var/www/html/install && curl -fs -o /dev/null http://localhost/"]
      start_period: 10m
      interval: 10s
      timeout: 10s
      retries: 3

  proxy:
    image: nginx:1.30.6
    depends_on:
      shop:
        condition: service_healthy
        restart: true
    command:
      - sh
      - -c
      - |
        if [ ! -f /etc/nginx/certs/localhost.crt ]; then
          openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
            -subj /CN=localhost -addext subjectAltName=DNS:localhost \
            -keyout /etc/nginx/certs/localhost.key -out /etc/nginx/certs/localhost.crt
        fi
        exec nginx -g "daemon off;"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - proxy-certs:/etc/nginx/certs

volumes:
  db-data:
  shop-data:
  proxy-certs:
